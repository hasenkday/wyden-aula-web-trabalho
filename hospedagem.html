<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AULA WEB - HOSPEDAGEM DE SITE</title>
    <link rel="stylesheet" href="styles/main.css" />
    <script src="utils/storage.js"></script>
    <script src="./components/organisms/header-nav/header-nav.js"></script>
    <script src="./components/organisms/frog-head/frog-head.js"></script>
    <script src="./components/organisms/footer/footer.js"></script>
  </head>

  <body>
    <header id="header-nav" class="header-nav"></header>
    <div id="frog-head"></div>

    <div class="content">
      <div class="container wrapper h-full">
        <h1>🚀 AULA WEB - HOSPEDAGEM DE SITE</h1>

        <p>Bem-vindo(a) ao mundo dos <span class="destaque">sites mágicos!</span></p>
        <p>Hoje usamos o <strong>Netlify</strong> para hospedar este site!</p>
        <p>É leve, rápido e divertido! 😄</p>
      </div>
    </div>

    <footer id="footer"></footer>

    <script>
      function renderAll() {
        document.querySelector('#header-nav').innerHTML = HeaderNav();
        HeaderNavPillAnimation();

        document.querySelector('#frog-head').innerHTML = FrogHead();
        document.querySelector('#footer').innerHTML = Footer();
      }

      renderAll();
    </script>
  </body>
</html>
