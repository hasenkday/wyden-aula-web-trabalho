<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />

    <title>Nadia | Portal - Dev Web</title>

    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="./projects/roteiro-7/style.css" />
  </head>

  <body>
    <header id="header-nav" class="header-nav"></header>
    <div id="frog-head"></div>

    <h2 class="content-headline">Roteiro 7 - Integração HTML com PHP</h2>
    <div class="roteiro-8 content">
      <div class="container flex-row">
        <section class="flex-col buttons">
          <div class="flex-row items-center">
            <h4>Exemplos</h4>
            <hr />
          </div>
          <button
            onclick="switchExemple(`${CONFIG.API_URL}/roteiro-8/exemplos/1`, this)"
            class="button fill"
          >
            Ver exemplo 1 &emsp; &rarr;
          </button>
          <button
            onclick="switchExemple(`${CONFIG.API_URL}/roteiro-8/exemplos/2`, this)"
            class="button fill"
          >
            Ver exemplo 2 &emsp; &rarr;
          </button>
          <button
            onclick="switchExemple(`${CONFIG.API_URL}/roteiro-8/exemplos/3`, this)"
            class="button fill"
          >
            Ver exemplo 3 &emsp; &rarr;
          </button>
          <button
            onclick="switchExemple(`${CONFIG.API_URL}/roteiro-8/exemplos/4`, this)"
            class="button fill"
          >
            Ver exemplo 4 &emsp; &rarr;
          </button>
          <button
            onclick="switchExemple(`${CONFIG.API_URL}/roteiro-8/exemplos/5`, this)"
            class="button fill"
          >
            Ver exemplo 5 &emsp; &rarr;
          </button>

          <div class="flex-row items-center mt-sm">
            <h4>Exercícios</h4>
            <hr />
          </div>
          <button
            onclick="switchExemple(`${CONFIG.API_URL}/roteiro-8/exercicios/1`, this)"
            class="button fill"
          >
            Ver exercício 1 &emsp; &rarr;
          </button>
          <button
            onclick="switchExemple(`${CONFIG.API_URL}/roteiro-8/exercicios/2`, this)"
            class="button fill"
          >
            Ver exercício 2 &emsp; &rarr;
          </button>
          <button
            onclick="switchExemple(`${CONFIG.API_URL}/roteiro-8/exercicios/3`, this)"
            class="button fill"
          >
            Ver exercício 3 &emsp; &rarr;
          </button>
          <button
            onclick="switchExemple(`${CONFIG.API_URL}/roteiro-8/exercicios/4`, this)"
            class="button fill"
          >
            Ver exercício 4 &emsp; &rarr;
          </button>
        </section>

        <div id="playground" class="playground section-card">
          <pre id="playground-example"></pre>
          <div class="output">
            <pre id="playground-output"></pre>
          </div>
        </div>
      </div>
    </div>

    <footer id="footer"></footer>

    <script src="./utils/render-base-layout.js" type="module"></script>
    <script src="./config.js"></script>
    <script src="./projects/roteiro-8/script.js"></script>
  </body>
</html>
