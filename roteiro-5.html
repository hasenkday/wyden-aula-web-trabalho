<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />

    <title>Nadia | Portal - Dev Web</title>

    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="./projects/roteiro-5/style.css" />
  </head>

  <body>
    <header id="header-nav" class="header-nav"></header>
    <div id="frog-head"></div>

    <h2 class="content-headline">Roteiro 5 - JS Externo, Manipulação de DOM e LocalStorage</h2>
    <div class="roteiro-5 content">
      <div class="container">
        <section class="section-card flex-row items-center justify-between">
          <h3>Gerenciador de Tarefas e Preferências</h3>
          <button id="theme-button" class="button default md" style="align-self: center">
            Alterar Tema dos Cards
          </button>
        </section>

        <section class="section-card">
          <h3>Cadastrar Nova Tarefa</h3>
          <div class="flex-col" style="gap: 4px">
            <form id="tasks-form" class="flex-row">
              <input id="task-input" type="text" placeholder="Digite uma nova tarefa..." required />
              <button type="submit" class="button default md">
                <i class="fa-solid fa-plus"></i>
                Adicionar
              </button>
            </form>
            <small id="error-msg" class="error" style="display: none"></small>
          </div>
        </section>

        <section class="section-card">
          <div class="flex-row items-center justify-between tasks-header">
            <div class="flex-row items-center">
              <h3>Minhas Tarefas</h3>
              <span id="tasks-counter" class="taks-counter"></span>
            </div>

            <div class="flex-row items-center controls">
              <input id="task-filter" type="text" placeholder="Filtrar tarefas..." />
              <!-- TODO: create select custom component instead of using native one -->
              <select id="sort-tasks" name="sort-tasks">
                <option value="1">A-Z</option>
                <option value="2">Z-A</option>
                <option value="3">Concluídas primeiro</option>
                <option value="4" selected>Não concluídas primeiro</option>
                <option value="5">Data mais recente</option>
                <option value="6">Data mais antiga</option>
              </select>
              <button id="btn-limpar" class="button default md btn-danger">Limpar todas</button>
            </div>
          </div>
          <ul id="tasks-list" class="output"></ul>
        </section>
      </div>
    </div>

    <footer id="footer"></footer>

    <script src="./utils/render-base-layout.js" type="module"></script>
    <script src="./projects/roteiro-5/script.js" type="module"></script>
  </body>
</html>
