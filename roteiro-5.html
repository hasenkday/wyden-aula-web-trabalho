<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />

    <title>Nadia | Portal - Dev Web</title>

    <link rel="stylesheet" href="styles/main.css" />

    <script src="utils/storage.js"></script>
    <script src="./components/organisms/header-nav/header-nav.js"></script>
    <script src="./components/organisms/frog-head/frog-head.js"></script>
    <script src="./components/organisms/footer/footer.js"></script>

    <link rel="stylesheet" href="./projects/roteiro-5/style.css" />
    <script src="./projects/roteiro-5/script.js"></script>
  </head>

  <body>
    <header id="header-nav" class="header-nav"></header>
    <div id="frog-head"></div>

    <h2 class="content-headline">Roteiro 5 - JS Externo, Manipulação de DOM e LocalStorage</h2>
    <div class="roteiro-4 content">
      <div class="container">
        <section id="sec-form" class="section-card">
          <h3>Gerenciador de Tarefas e Preferências</h3>
          <button id="btn-tema" class="button default md" style="align-self: center">
            Alterar Tema
          </button>
        </section>

        <section id="sec-form" class="section-card">
          <h3>1) Cadastrar Nova Tarefa</h3>
          <form id="form-tarefa">
            <div class="field-group">
              <input
                type="text"
                id="input-tarefa"
                placeholder="Digite uma nova tarefa..."
                required
              />
              <button type="submit">Adicionar</button>
            </div>
            <small id="erro-msg" class="error"></small>
          </form>
        </section>

        <section id="sec-lista" class="section-card">
          <h2>2) Minhas Tarefas (Persistidas no LocalStorage)</h2>
          <div class="actions">
            <button id="btn-limpar" class="btn-danger">Limpar Todas</button>
          </div>
          <ul id="lista-tarefas"></ul>
        </section>
      </div>
    </div>

    <footer id="footer"></footer>

    <script>
      function renderAll() {
        document.querySelector('#header-nav').innerHTML = HeaderNav();
        HeaderNavPillAnimation();

        document.querySelector('#frog-head').innerHTML = FrogHead();
        document.querySelector('#footer').innerHTML = Footer();
      }

      renderAll();
    </script>
  </body>
</html>
