<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />

    <title>Nadia | Portal - Dev Web</title>

    <link rel="stylesheet" href="styles/main.css" />

    <script src="utils/storage.js"></script>
    <script src="./components/organisms/header-nav/header-nav.js"></script>
    <script src="./components/organisms/frog-head/frog-head.js"></script>
    <script src="./components/organisms/footer/footer.js"></script>
    <script src="./components/molecules/callout/callout.js"></script>
    <script src="./components/molecules/card/card.js"></script>
  </head>

  <body>
    <header id="header-nav" class="header-nav"></header>
    <div id="frog-head"></div>

    <h2 class="content-headline">Bem-vindo(a)!</h2>
    <div class="content">
      <div class="container">
        <div id="callout"></div>

        <div class="grid-cols-2">
          <div id="card1"></div>
          <div id="card2"></div>
          <div id="card3"></div>
          <div id="card4"></div>
        </div>
      </div>
    </div>

    <footer id="footer"></footer>

    <script>
      function renderAll() {
        document.querySelector('#header-nav').innerHTML = HeaderNav();
        HeaderNavPillAnimation();

        document.querySelector('#frog-head').innerHTML = FrogHead();
        document.querySelector('#footer').innerHTML = Footer();

        document.querySelector('#callout').innerHTML = Callout({
          title: 'Portal Prático da turma de desenvolvimento Web',
          description: `
            Este roteiro foi projetado para elevar o nível estético e estrutural 
            das nossas páginas web. Explore as seções do portal para verificar a evolução
            do uso de CSS, layouts responsivos e novos elementos interativos.
          `,
          color: 'var(--color-primary-400)',
        });

        document.querySelector('#card1').innerHTML = Card({
          title: 'Aulas 01 - Mini Corrida',
          description: 'Mini jogo de corrida demonstrando o uso de HTML e CSS3.',
          buttonLabel: 'Ver Corrida &rarr;',
          cardUrl: 'aula-1.html',
        });

        document.querySelector('#card2').innerHTML = Card({
          title: 'Aulas 02 e 03 - Fundamentos',
          description:
            'Estrutura básica de tags HTML, uso do Bloco de Notas e publicação estática via Netlify.',
          buttonLabel: 'Ver Currículo &rarr;',
          cardUrl: 'curriculo.html',
        });

        document.querySelector('#card3').innerHTML = Card({
          title: 'Aula 04 - Design & CSS',
          description:
            'Estilização com CSS3, conceitos de box model, cores modernas, tipografia e novos componentes visualmente atraentes.',
          buttonLabel: 'Ver Exemplos &rarr;',
          cardUrl: 'aula-4.html',
        });

        document.querySelector('#card4').innerHTML = Card({
          title: 'Aula 05 - Roteiro 4 - Lógica JS',
          description:
            'Uma página com exemplos práticos de lógica de programação em JavaScript inline, mostrando variáveis, entrada/saída, decisões, laços, arrays, funções, DOM e um mini-jogo.',
          buttonLabel: 'Ver Exemplos &rarr;',
          cardUrl: 'aula-5.html',
        });
      }

      renderAll();
    </script>
  </body>
</html>
