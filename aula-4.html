<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Nadia | Portal - Dev Web</title>

    <link rel="stylesheet" href="styles/main.css" />

    <script src="utils/storage.js"></script>
    <script src="./components/organisms/header-nav/header-nav.js"></script>
    <script src="./components/organisms/frog-head/frog-head.js"></script>
    <script src="./components/organisms/footer/footer.js"></script>

    <script src="./projects/aula-4/exemplo1.js"></script>
    <script src="./projects/aula-4/exemplo2.js"></script>
    <script src="./projects/aula-4/exemplo3.js"></script>
    <script src="./projects/aula-4/exemplo4.js"></script>
    <script src="./projects/aula-4/exemplo5.js"></script>
    <script src="./projects/aula-4/exemplo6.js"></script>
    <script src="./projects/aula-4/exemplo7.js"></script>
    <script src="./projects/aula-4/exemplo8.js"></script>
    <script src="./projects/aula-4/exemplo9.js"></script>
    <script src="./projects/aula-4/exemplo10.js"></script>
  </head>

  <body>
    <header id="header-nav" class="header-nav"></header>
    <div id="frog-head"></div>

    <h2 class="content-headline">Aula 3: Introdução a DIV e CSS</h2>
    <div class="content aula3">
      <div class="container">
        <div class="examples">
          <div onclick="changeExample(1, this)" class="button active">
            Exemplo 1 - DIV e CSS <span>🡢</span>
          </div>
          <div onclick="changeExample(2, this)" class="button">
            Exemplo 2 - Várias DIVs <span>🡢</span>
          </div>
          <div onclick="changeExample(3, this)" class="button">
            Exemplo 3 - Cores <span>🡢</span>
          </div>
          <div onclick="changeExample(4, this)" class="button">
            Exemplo 4 - Imagem <span>🡢</span>
          </div>
          <div onclick="changeExample(5, this)" class="button">
            Exemplo 5 - Bordas arredondadas <span>🡢</span>
          </div>
          <div onclick="changeExample(6, this)" class="button">
            Exemplo 6 - Sombra <span>🡢</span>
          </div>
          <div onclick="changeExample(7, this)" class="button">
            Exemplo 7 - Centralizado <span>🡢</span>
          </div>
          <div onclick="changeExample(8, this)" class="button">
            Exemplo 8 - Flexbox <span>🡢</span>
          </div>
          <div onclick="changeExample(9, this)" class="button">
            Exemplo 9 - Hover <span>🡢</span>
          </div>
          <div onclick="changeExample(10, this)" class="button">
            Exemplo 10 - Responsivo <span>🡢</span>
          </div>
        </div>

        <div class="section-card" style="flex: 1; overflow: hidden">
          <div id="playground"></div>
        </div>
      </div>
    </div>

    <style>
      .examples {
        display: flex;
        flex: 1;
        gap: 8px;
        flex-direction: column;
      }

      #playground {
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow: auto;
        height: 100%;
      }

      .aula3 container {
        flex-direction: row;
      }

      @media screen and (max-width: 1080px) {
        .aula3 container {
          flex-direction: column;
        }

        .aula3 .examples {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>

    <footer id="footer"></footer>

    <script>
      function renderAll() {
        document.querySelector('#header-nav').innerHTML = HeaderNav();
        HeaderNavPillAnimation();

        document.querySelector('#frog-head').innerHTML = FrogHead();
        document.querySelector('#footer').innerHTML = Footer();

        document.querySelector('#playground').innerHTML = Exemplo1();
      }
      renderAll();

      function changeExample(example, currentButton) {
        document.querySelectorAll('.button').forEach((item) => item.classList.remove('active'));
        currentButton.classList.add('active');

        switch (example) {
          case 1:
            document.querySelector('#playground').innerHTML = Exemplo1();
            break;
          case 2:
            document.querySelector('#playground').innerHTML = Exemplo2();
            break;
          case 3:
            document.querySelector('#playground').innerHTML = Exemplo3();
            break;
          case 4:
            document.querySelector('#playground').innerHTML = Exemplo4();
            break;
          case 5:
            document.querySelector('#playground').innerHTML = Exemplo5();
            break;
          case 6:
            document.querySelector('#playground').innerHTML = Exemplo6();
            break;
          case 7:
            document.querySelector('#playground').innerHTML = Exemplo7();
            break;
          case 8:
            document.querySelector('#playground').innerHTML = Exemplo8();
            break;
          case 9:
            document.querySelector('#playground').innerHTML = Exemplo9();
            break;
          case 10:
            document.querySelector('#playground').innerHTML = Exemplo10();
            break;
          default:
            break;
        }
      }
    </script>
  </body>
</html>
