<!doctype html>
<html>
  <head>
    <title>Exemplo 9 - Hover</title>
    <style>
      .caixa {
        width: 150px;
        height: 100px;
        background-color: lightblue;
        transition: 0.3s;
        text-align: center;
        line-height: 100px;
      }
      .caixa:hover {
        background-color: darkblue;
        color: white;
        transform: scale(1.1);
      }
    </style>
  </head>
  <body>
    <h1>Efeito Hover</h1>
    <div class="caixa">Passe o mouse!</div>

    <br />
    <a href="index.html" style="color: #0077cc; font-weight: bold"><- Voltar</a>
  </body>
</html>
